    var slide = document.getElementById('cs-1bm1');
    if (slide && !slide.classList.contains('cards-entered')) {
      slide.classList.add('cards-entered');
      return true;
    }
    return false;
  }

  window.addEventListener('DOMContentLoaded', function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get('cards') === '1' || params.get('back') === '1') {
      cs1bm1RevealCards();
    }
    if (params.get('back') === '1') {
      document.querySelectorAll('.ti-flip-inner').forEach(function (card) {
        card.classList.add('is-flipped');
      });
    }
  });

  window.addEventListener('click', function () {
    cs1bm1RevealCards();
  });

  window.addEventListener('keydown', function (event) {
    if (event.key === ' ' || event.key === 'Enter' || event.key === 'ArrowRight') {
      if (cs1bm1RevealCards()) event.preventDefault();
    }
  });
