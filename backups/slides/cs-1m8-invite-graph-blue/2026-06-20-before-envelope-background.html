<script>
window.cs1m8InviteGraphBlueAdvance = function(){
  const s = document.getElementById('cs-1m8-invite-graph-blue');
  if (!s) return false;
  const n = parseInt(s.dataset.stage || '0', 10);
  if (n >= 1) return false;
  s.dataset.stage = String(n + 1);
  return true;
};
window.cs1m8InviteGraphBlueReverse = function(){
  const s = document.getElementById('cs-1m8-invite-graph-blue');
  if (!s) return false;
  const n = parseInt(s.dataset.stage || '0', 10);
  if (n <= 0) return false;
  s.dataset.stage = String(n - 1);
  return true;
};
</script>
