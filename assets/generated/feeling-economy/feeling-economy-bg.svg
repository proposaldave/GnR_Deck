<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Dark cinematic feeling economy background">
  <defs>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="54%">
      <stop offset="0" stop-color="#B8954A" stop-opacity=".62"/>
      <stop offset=".32" stop-color="#7b5426" stop-opacity=".24"/>
      <stop offset=".72" stop-color="#1A1612" stop-opacity=".72"/>
      <stop offset="1" stop-color="#070606"/>
