<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A social pickleball club split between broken ratings, manual programming, missing reciprocity, and a warmer invitation-led community builder system.">
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset=".48" stop-color="#f3ead8"/>
      <stop offset="1" stop-color="#e5d5b8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f3ead8" stop-opacity=".94"/>
      <stop offset=".46" stop-color="#f3ead8" stop-opacity=".48"/>
      <stop offset="1" stop-color="#f3ead8" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="court" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f95bd" stop-opacity=".62"/>
      <stop offset=".52" stop-color="#5b8fd4" stop-opacity=".50"/>
      <stop offset="1" stop-color="#c8462c" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="44%" r="44%">
      <stop offset="0" stop-color="#ffd777" stop-opacity=".70"/>
      <stop offset=".35" stop-color="#b8954a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b8954a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1a1612" flood-opacity=".16"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.25" fill="#1a1612" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity=".24"/>
  <circle cx="1120" cy="400" r="510" fill="url(#glow)"/>

  <!-- faded club environment -->
  <g opacity=".42">
    <rect x="810" y="90" width="620" height="350" rx="34" fill="#1a1612" opacity=".06"/>
    <path d="M850 410 C960 220 1170 165 1390 300" fill="none" stroke="#b8954a" stroke-width="2" opacity=".28"/>
    <path d="M760 520 C960 330 1195 315 1515 505" fill="none" stroke="#f7d77d" stroke-width="3.5" opacity=".42"/>
    <path d="M670 680 C905 470 1210 475 1525 640" fill="none" stroke="#f7d77d" stroke-width="2.5" opacity=".32"/>
    <g fill="#1a1612" opacity=".16">
      <rect x="1060" y="96" width="310" height="82" rx="8"/>
      <rect x="1130" y="184" width="300" height="16" rx="8"/>
      <rect x="1145" y="220" width="280" height="13" rx="6"/>
      <rect x="1170" y="257" width="230" height="12" rx="6"/>
    </g>
  </g>

  <!-- left: broken rating culture -->
  <g transform="translate(110 118)" filter="url(#shadow)" opacity=".88">
    <rect x="0" y="0" width="330" height="230" rx="20" fill="#241f19" opacity=".84"/>
    <text x="28" y="54" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="5" fill="#f3ead8">RATING-FIRST</text>
    <path d="M38 96 H286" stroke="#f3ead8" stroke-opacity=".22" stroke-width="2"/>
    <g font-family="Manrope, Arial, sans-serif" font-weight="900" fill="#f3ead8">
      <text x="38" y="145" font-size="40">3.74</text>
      <text x="154" y="145" font-size="40" opacity=".55">4.12</text>
      <text x="258" y="145" font-size="40" fill="#c8462c">?</text>
    </g>
    <path d="M54 180 C112 134 172 224 238 172" fill="none" stroke="#c8462c" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 203 L286 83" stroke="#c8462c" stroke-width="5" stroke-linecap="round" opacity=".78"/>
  </g>

  <!-- center: manual calendar and booking chaos -->
  <g transform="translate(360 305)" filter="url(#shadow)">
    <rect x="0" y="0" width="425" height="310" rx="26" fill="#fbf7ef" opacity=".88" stroke="#b8954a" stroke-opacity=".45"/>
    <text x="32" y="54" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="950" letter-spacing="5" fill="#c8462c">MANUAL PROGRAMMING</text>
    <g stroke="#b8954a" stroke-opacity=".36" stroke-width="2">
      <path d="M34 86 H391"/>
      <path d="M34 142 H391"/>
      <path d="M34 198 H391"/>
      <path d="M34 254 H391"/>
      <path d="M118 86 V282"/>
      <path d="M206 86 V282"/>
      <path d="M294 86 V282"/>
    </g>
    <g fill="#5b8fd4" opacity=".72">
      <rect x="52" y="106" width="48" height="22" rx="7"/>
      <rect x="225" y="158" width="50" height="22" rx="7"/>
      <rect x="312" y="215" width="48" height="22" rx="7"/>
    </g>
    <g fill="#c8462c" opacity=".72">
      <rect x="132" y="106" width="52" height="22" rx="7"/>
      <rect x="50" y="215" width="45" height="22" rx="7"/>
      <rect x="307" y="107" width="58" height="22" rx="7"/>
    </g>
    <g fill="#b8954a" opacity=".88">
      <rect x="132" y="214" width="52" height="22" rx="7"/>
      <rect x="222" y="106" width="56" height="22" rx="7"/>
    </g>
    <path d="M78 283 C132 248 168 303 218 266 C266 232 315 302 364 266" fill="none" stroke="#c8462c" stroke-width="4" stroke-dasharray="9 10" opacity=".72"/>
  </g>

  <!-- right: actual social pickleball court -->
  <g transform="translate(800 250)" opacity=".88">
    <rect x="0" y="0" width="670" height="405" rx="30" fill="url(#court)" opacity=".68" filter="url(#shadow)"/>
    <rect x="46" y="48" width="578" height="300" rx="8" fill="none" stroke="#fbf7ef" stroke-width="6" opacity=".68"/>
    <path d="M335 48 V348 M46 198 H624 M190 48 V348 M480 48 V348" stroke="#fbf7ef" stroke-width="4" opacity=".58"/>
    <path d="M46 198 H624" stroke="#1a1612" stroke-width="10" opacity=".28"/>
    <path d="M46 198 H624" stroke="#fbf7ef" stroke-width="2" opacity=".55"/>
    <g fill="#1a1612" opacity=".55">
      <circle cx="150" cy="145" r="16"/><rect x="139" y="163" width="22" height="54" rx="10"/>
      <circle cx="236" cy="250" r="16"/><rect x="225" y="268" width="22" height="54" rx="10"/>
      <circle cx="455" cy="145" r="16"/><rect x="444" y="163" width="22" height="54" rx="10"/>
      <circle cx="540" cy="250" r="16"/><rect x="529" y="268" width="22" height="54" rx="10"/>
      <circle cx="348" cy="206" r="20" fill="#f7d77d" opacity=".85"/>
    </g>
    <g fill="none" stroke="#f7d77d" stroke-width="5" stroke-linecap="round" opacity=".78">
      <path d="M178 138 C260 76 405 84 514 150"/>
      <path d="M214 288 C300 355 430 348 514 290"/>
    </g>
    <g stroke="#c8462c" stroke-width="6" stroke-linecap="round" opacity=".72">
      <path d="M198 128 L244 174 M244 128 L198 174"/>
      <path d="M485 239 L531 285 M531 239 L485 285"/>
    </g>
  </g>

  <!-- reciprocity / community builder hint -->
  <g transform="translate(1030 648)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="128" rx="64" fill="#fbf7ef" opacity=".92" stroke="#b8954a" stroke-opacity=".42"/>
    <circle cx="70" cy="64" r="34" fill="#b8954a" opacity=".22"/>
    <circle cx="70" cy="56" r="13" fill="#1a1612" opacity=".65"/>
    <path d="M42 93 C52 72 88 72 99 93" fill="none" stroke="#1a1612" stroke-width="7" stroke-linecap="round" opacity=".65"/>
    <path d="M138 65 C180 20 230 20 278 65" fill="none" stroke="#5b8fd4" stroke-width="5" stroke-linecap="round"/>
    <path d="M278 65 C235 112 178 112 138 65" fill="none" stroke="#c8462c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="65" r="8" fill="#5b8fd4"/>
    <circle cx="278" cy="65" r="8" fill="#c8462c"/>
    <text x="132" y="103" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="950" letter-spacing="3.2" fill="#b8954a">RECIPROCITY LOOP</text>
  </g>

  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="#f3ead8" opacity=".10"/>
</svg>
