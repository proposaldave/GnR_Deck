      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="58%" stop-color="#f3ead8"/>
      <stop offset="100%" stop-color="#e4d0ab"/>
    </radialGradient>
    <linearGradient id="worlds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8FD4" stop-opacity=".36"/>
      <stop offset="42%" stop-color="#F3EAD8" stop-opacity=".18"/>
      <stop offset="59%" stop-color="#F3EAD8" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#C8462C" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="newGlow" cx="72%" cy="60%" r="46%">
      <stop offset="0%" stop-color="#B8954A" stop-opacity=".68"/>
      <stop offset="38%" stop-color="#C8462C" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C8462C" stop-opacity="0"/>
