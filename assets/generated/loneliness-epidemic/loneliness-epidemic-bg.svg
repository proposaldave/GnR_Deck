<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Loneliness epidemic background">
  <defs>
    <radialGradient id="warmCenter" cx="56%" cy="40%" r="68%">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset=".45" stop-color="#f3ead8"/>
      <stop offset=".78" stop-color="#dbcda9"/>
      <stop offset="1" stop-color="#9f8051"/>
    </radialGradient>
    <linearGradient id="leftBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2730"/>
      <stop offset=".46" stop-color="#657584"/>
      <stop offset="1" stop-color="#f3ead8"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dfe8f5" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#5b8fd4" stop-opacity=".23"/>
      <stop offset="1" stop-color="#5b8fd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="communityGlow" cx="78%" cy="56%" r="35%">
      <stop offset="0" stop-color="#f8d77d" stop-opacity=".68"/>
      <stop offset=".48" stop-color="#b8954a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b8954a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
    <style>
      .ink{fill:#1a1612}
      .muted{opacity:.34}
      .line-blue{stroke:#5b8fd4;stroke-width:1.35;stroke-dasharray:6 10;fill:none;opacity:.38}
      .line-gold{stroke:#b8954a;stroke-width:1.65;stroke-dasharray:7 11;fill:none;opacity:.44}
      .line-red{stroke:#c8462c;stroke-width:1.45;stroke-dasharray:5 10;fill:none;opacity:.32}
      .warm-line{stroke:#f6d27b;stroke-width:2.4;fill:none;opacity:.72}
      .node-blue{fill:#5b8fd4;opacity:.42}
      .node-gold{fill:#b8954a;opacity:.52}
      .node-red{fill:#c8462c;opacity:.44}
      .person{fill:#1a1612;opacity:.52}
      .person-warm{fill:#1a1612;opacity:.68}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#warmCenter)"/>
  <rect width="1600" height="900" filter="url(#paperNoise)" opacity=".74"/>
  <path d="M0 0h560c-78 98-132 212-160 342-26 124-8 254 54 390H0z" fill="url(#leftBlue)" opacity=".20"/>
  <circle cx="1260" cy="520" r="430" fill="url(#communityGlow)"/>

  <!-- pale civic grid -->
  <g opacity=".18" stroke="#8b7652" stroke-width=".7">
    <path d="M0 186h1600M0 358h1600M0 530h1600M0 702h1600"/>
    <path d="M150 0v900M330 0v900M510 0v900M690 0v900M870 0v900M1050 0v900M1230 0v900M1410 0v900"/>
  </g>

  <!-- broken social graph -->
  <g>
    <path class="line-blue" d="M120 640 C270 512 360 606 512 460 S762 364 912 510"/>
    <path class="line-red" d="M180 286 C324 382 460 266 618 334 S902 386 1090 288"/>
    <path class="line-gold" d="M74 766 C258 684 398 734 560 660 S842 640 1018 704"/>
    <path class="line-blue" d="M220 174 C370 238 474 198 626 246 S838 226 976 164"/>
    <path class="warm-line" d="M1040 568 C1130 506 1220 488 1302 530 S1454 612 1532 560"/>
    <path class="warm-line" d="M1068 646 C1180 580 1285 604 1370 675"/>
  </g>

  <!-- connection nodes -->
  <g>
    <circle class="node-blue" cx="122" cy="640" r="7"/><circle class="node-blue" cx="346" cy="584" r="5"/><circle class="node-red" cx="512" cy="460" r="7"/><circle class="node-gold" cx="912" cy="510" r="8"/>
    <circle class="node-red" cx="180" cy="286" r="5"/><circle class="node-gold" cx="458" cy="286" r="6"/><circle class="node-blue" cx="682" cy="352" r="5"/><circle class="node-gold" cx="1090" cy="288" r="7"/>
    <circle class="node-gold" cx="74" cy="766" r="8"/><circle class="node-blue" cx="560" cy="660" r="6"/><circle class="node-red" cx="1018" cy="704" r="6"/>
    <circle fill="#f6d27b" cx="1040" cy="568" r="8"/><circle fill="#f6d27b" cx="1218" cy="492" r="10"/><circle fill="#f6d27b" cx="1302" cy="530" r="7"/><circle fill="#f6d27b" cx="1454" cy="612" r="9"/><circle fill="#f6d27b" cx="1532" cy="560" r="6"/>
  </g>

  <!-- isolated people with phone glows -->
  <g>
    <g transform="translate(178 615)">
      <circle cx="0" cy="-58" r="39" fill="url(#phoneGlow)"/>
      <circle class="person" cx="0" cy="-84" r="12"/><path class="person" d="M-18-68h36l9 88h-54z"/>
      <rect x="16" y="-62" width="9" height="16" rx="2" fill="#5b8fd4" opacity=".72"/>
    </g>
    <g transform="translate(392 430) scale(.82)">
      <circle cx="0" cy="-58" r="39" fill="url(#phoneGlow)"/>
      <circle class="person" cx="0" cy="-84" r="12"/><path class="person" d="M-18-68h36l9 88h-54z"/>
      <rect x="16" y="-62" width="9" height="16" rx="2" fill="#5b8fd4" opacity=".72"/>
    </g>
    <g transform="translate(642 654) scale(.9)">
      <circle cx="0" cy="-58" r="39" fill="url(#phoneGlow)"/>
      <circle class="person" cx="0" cy="-84" r="12"/><path class="person" d="M-18-68h36l9 88h-54z"/>
      <rect x="16" y="-62" width="9" height="16" rx="2" fill="#5b8fd4" opacity=".72"/>
    </g>
    <g transform="translate(886 362) scale(.76)">
      <circle cx="0" cy="-58" r="39" fill="url(#phoneGlow)"/>
      <circle class="person" cx="0" cy="-84" r="12"/><path class="person" d="M-18-68h36l9 88h-54z"/>
      <rect x="16" y="-62" width="9" height="16" rx="2" fill="#5b8fd4" opacity=".72"/>
    </g>
  </g>

  <!-- empty chairs -->
  <g stroke="#1a1612" stroke-width="4" fill="none" opacity=".18">
    <path d="M266 726h70v55h-70zM272 782v58M330 782v58M266 724l-22-44M336 724l22-44"/>
    <path d="M748 724h74v58h-74zM754 784v58M816 784v58M748 724l-20-46M822 724l20-46"/>
  </g>

  <!-- warm community cluster on right -->
  <g transform="translate(1240 555)">
    <ellipse cx="0" cy="64" rx="255" ry="94" fill="#1a1612" opacity=".11"/>
    <path d="M-220 70c68-64 144-94 227-90 82 4 153 42 213 104" fill="none" stroke="#b8954a" stroke-width="5" opacity=".45"/>
    <g class="person-warm">
      <g transform="translate(-170 12)"><circle cx="0" cy="-76" r="17"/><path d="M-27-54h54l15 118h-84z"/></g>
      <g transform="translate(-92 -18) scale(1.04)"><circle cx="0" cy="-76" r="17"/><path d="M-27-54h54l15 118h-84z"/></g>
      <g transform="translate(0 -30) scale(1.1)"><circle cx="0" cy="-76" r="17"/><path d="M-27-54h54l15 118h-84z"/></g>
      <g transform="translate(90 -12) scale(1.02)"><circle cx="0" cy="-76" r="17"/><path d="M-27-54h54l15 118h-84z"/></g>
      <g transform="translate(172 24)"><circle cx="0" cy="-76" r="17"/><path d="M-27-54h54l15 118h-84z"/></g>
    </g>
    <g opacity=".92" stroke="#f8d77d" stroke-width="2.3" fill="none">
      <path d="M-154-58 C-92-120 8-132 76-88 S168-20 210 28"/>
      <path d="M-110 6 C-38-38 34-36 116 16"/>
      <circle cx="-154" cy="-58" r="6" fill="#f8d77d"/><circle cx="-34" cy="-108" r="7" fill="#f8d77d"/><circle cx="76" cy="-88" r="6" fill="#f8d77d"/><circle cx="116" cy="16" r="8" fill="#f8d77d"/><circle cx="210" cy="28" r="6" fill="#f8d77d"/>
    </g>
  </g>

  <!-- paper washes to protect future content area -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#warmCenter)" opacity=".18"/>
  <ellipse cx="698" cy="410" rx="585" ry="265" fill="#fbf7ef" opacity=".38" filter="url(#soft)"/>
  <path d="M0 0h1600v900H0z" fill="none" stroke="#b8954a" stroke-opacity=".10" stroke-width="2"/>
</svg>
