<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Fragmented real-world community with many nearby people and broken local connection paths">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset="0.42" stop-color="#f7efe1"/>
      <stop offset="1" stop-color="#e9d8b8"/>
    </linearGradient>
    <radialGradient id="warm" cx="74%" cy="26%" r="58%">
      <stop offset="0" stop-color="#f8d98d" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#b8954a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b8954a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="23%" cy="62%" r="52%">
      <stop offset="0" stop-color="#5B8FD4" stop-opacity=".25"/>
      <stop offset=".58" stop-color="#5B8FD4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5B8FD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="38"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .11"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1A1612" flood-opacity=".16"/>
    </filter>
    <style>
      .ink{fill:#1A1612}
      .blue{fill:#5B8FD4}
      .gold{fill:#B8954A}
      .red{fill:#C8462C}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ghost{opacity:.18}
      .person{filter:url(#softShadow)}
      .person .head{fill:#1A1612;opacity:.66}
      .person .body{fill:#1A1612;opacity:.52}
      .person.hot .body{fill:#C8462C;opacity:.70}
      .person.cool .body{fill:#5B8FD4;opacity:.62}
      .person.gold .body{fill:#B8954A;opacity:.68}
      .chair{fill:none;stroke:#1A1612;stroke-width:4;stroke-linecap:round;opacity:.22}
      .window{fill:#fbf7ef;opacity:.66}
      .window.dim{opacity:.22}
    </style>
  </defs>

