<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Abstract competitor wedge background: static admin coordination gives way to a warm human referral growth loop.">
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="58%" stop-color="#f3ead8"/>
      <stop offset="100%" stop-color="#e9d8b8"/>
    </radialGradient>
    <linearGradient id="splitMood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8FD4" stop-opacity=".38"/>
      <stop offset="38%" stop-color="#F3EAD8" stop-opacity=".22"/>
      <stop offset="57%" stop-color="#F3EAD8" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#C8462C" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8FD4" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#F3EAD8" stop-opacity=".44"/>
      <stop offset="100%" stop-color="#B8954A" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="warmPulse" cx="72%" cy="58%" r="44%">
      <stop offset="0%" stop-color="#f8c55f" stop-opacity=".66"/>
      <stop offset="44%" stop-color="#C8462C" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#C8462C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
